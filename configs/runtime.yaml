# configs/runtime.yaml
#
# Phase 2 runtime settings: which weights to load, how the co-pilot
# sounds. Protocol-level alert POLICY (cooldowns, rate cap, which
# severities speak) is NOT here -- that lives in configs/defaults.yaml
# and is resolved per protocol. This file only controls HOW an alert
# that policy already decided to emit is rendered as sound.

schema_version: 1

detector:
  # Swap to a new models/*.pt here when a new detector lands -- nothing
  # in src/ names a weights file. Classes are matched by NAME, and the
  # model is checked at load against the classes the object profile
  # binds, so a model that renamed/dropped a class fails at startup.
  # .onnx (onnxruntime) is the runtime default: same v5 weights exported,
  # test S01+S03 mAP50 .894 vs .892 (.pt), identical classes on 60/60 live
  # frames, 23 vs 36 ms/inference; live 19.9 vs 16.9 det-fps with audio on.
  # Threads capped to detector.threads (src/perception/detector.py). The
  # .pt stays for training and as the fallback: set it here to go back.
  weights: models/bootstrap_v5_best.onnx
  conf: 0.25                   # re-tune per model, on the tuning clips only
  iou: 0.5
  imgsz: 640                   # the size v4 was trained at
  device: cpu
  # torch CPU threads. null = physical cores - 2 (leaves room for capture,
  # recording, speech and the GUI). Letting torch AND the speech engine
  # each claim every core made the first detection take 5.4 s.
  threads: null

audio:
  enabled: true

  tts:
    # "piper" = offline neural TTS (onnxruntime, Windows/macOS/Linux).
    # "none"  = earcons only, spoken text printed to the console.
    # If piper is selected but its package or voice model is missing, the
    # runtime degrades to "none" with a printed warning -- it never stops
    # the session.
    backend: piper
    # Piper voice: the .onnx and its .onnx.json must sit side by side.
    voice_model: models/tts/en_US-lessac-medium.onnx
    # >1.0 is slower speech. Slightly slow reads better through a
    # headset over fan noise.
    length_scale: 1.1
    # onnxruntime threads for speech synthesis. Phrases are pre-rendered
    # once and cached, so speech can be slow; the detector cannot.
    threads: 2
    # Render every phrase the loaded protocol can speak (constraint
    # alert lines, step prompts, success lines) once at load / hot
    # reload, so speaking an alert never waits on synthesis competing
    # with the detector for CPU.
    prewarm: true

  output:
    # Master gain applied to earcons and speech, 0..1.
    volume: 0.8
    # null = OS default output device.
    device: null

  # Earcons: a distinct tone pattern per severity so the operator knows
  # how urgent it is before a word is spoken. Advisory is tone-only by
  # policy (defaults.yaml severity_tone_only).
  earcons:
    advisory:
      notes_hz: [660]
      note_ms: 120
      gap_ms: 0
    caution:
      notes_hz: [660, 880]
      note_ms: 110
      gap_ms: 40
    warning:
      notes_hz: [988, 988, 988]
      note_ms: 90
      gap_ms: 60
    # Quiet mode: one short soft tick per completed step, instead of
    # speaking prompts. Deliberately unlike any severity pattern.
    step:
      notes_hz: [1320]
      note_ms: 55
      gap_ms: 0
    # "Hey BAS" heard: listening for a command.
    wake:
      notes_hz: [880, 1320]
      note_ms: 70
      gap_ms: 15

  prompts:
    # Start-up mode. "voice" = prompts and success lines spoken;
    # "quiet" = a tick per completed step, only alerts spoken. Switchable
    # at runtime: "Hey BAS, quiet mode" / "Hey BAS, voice mode".
    mode: voice
    # When several steps become satisfiable at once (e.g. both modules
    # after the container opens), speak only the first in protocol order.
    # The GUI shows all of them. "first" | "none"
    speak_next_step: first
    # Speak a completed step's `success` line when the protocol defines
    # one (e.g. "Experiment complete. Log written.").
    speak_step_success: true
    # A skip alert names this many missed steps ("Missed on the yellow
    # module: Reseal the module."), then "And N more steps."
    max_named_skips: 2

  # Pending audio items beyond this are dropped oldest-first -- same rule
  # as every other runtime queue: stale audio is worse than none.
  queue_maxsize: 4

# Hands-free control: "Hey BAS, <command>", or "Hey BAS" then the
# command within command_window_s. Offline (Vosk small English model,
# recognition restricted to the phrases below, so ordinary speech -- and
# the co-pilot's own voice -- cannot trigger anything). A command is
# accepted only if the WHOLE utterance matches: "pause the music" does
# not pause. Degrades to disabled (with a startup warning) if the
# package, model or microphone is missing.
voice_control:
  enabled: true
  model: models/asr/vosk-model-small-en-us-0.15
  # "bas" is not in the recognizer's vocabulary; "bass" is its homophone.
  wake_phrase: hey bass
  command_window_s: 5
  # "restart experiment" must be said again within this long to take effect
  restart_confirm_s: 8
  # null = OS default microphone.
  input_device: null
  commands:
    pause: [pause]
    resume: [resume, continue]
    quiet: [quiet mode, quiet]
    voice: [voice mode, voice prompts]
    repeat: [repeat]
    # Marks the current step done when the camera missed it (logged as an
    # operator override), then speaks the next step.
    next: [next step]
    # Starts the experiment again from step one as a NEW session (new log;
    # the old one is closed and its hash chain verified). Must be said TWICE
    # within restart_confirm_s -- one misheard wake phrase must not wipe a run. Two-word
    # phrases on purpose: a bare "restart" sits too close to "resume".
    restart: [restart experiment, start over]

# Local recording + live stream share ONE H.264 encode (src/runtime/recorder.py).
# Local segments are MPEG-TS: measured to survive an encoder crash far
# better than MP4 (96/105 vs 69/105 frames recovered). Play with VLC or
# ffplay; remux to .mp4 losslessly with `ffmpeg -i seg_000.ts -c copy x.mp4`.
recording:
  enabled: true
  out_dir: recordings          # <out_dir>/<session_id>/seg_000.ts + video.json
  fps: 15                      # constant-rate output, aligned to capture timestamps
  segment_s: 300
  crf: 28
  max_bitrate_kbps: 1000       # caps the stream too: restricted downlink
  preset: ultrafast            # the detector needs the CPU more than we need bits
  # "auto" = the ffmpeg bundled by imageio-ffmpeg (pinned, has libx264 on
  # every OS), else ffmpeg on PATH. Or an explicit path.
  ffmpeg: auto
  queue_maxsize: 8

# The PS's "streams video to a configurable IP". Push-only (no server, no
# inbound port); a receiver being down costs nothing and never stops the
# local recording. This and nothing else leaves the machine at runtime --
# it goes only to the address set here, never to the internet. Default is
# loopback: set the ground-station IP for a real deployment.
#   udp://<ip>:<port>?pkt_size=1316   MPEG-TS over UDP. View: ffplay udp://@:<port>
#   rtsp://<server>:8554/bas          push to an RTSP server (e.g. mediamtx)
stream:
  enabled: true
  url: udp://127.0.0.1:5000?pkt_size=1316

# Where frames come from (src/runtime/capture.py). Every frame is stamped
# with the monotonic time at acquisition.
capture:
  # int = camera index; or a video file path (replayed at its own fps,
  # like a live camera); or a stream URL (rtsp://, udp://, http://).
  source: 0
  # auto | dshow | msmf (Windows) | v4l2 (Linux) | avfoundation (macOS)
  backend: auto
  width: null                  # requests only; the device may ignore them
  height: null
  fps: null
  realtime: true               # files: pace to their own fps
  loop: false                  # files: restart at end
  reconnect_s: 2.0             # camera lost: reopen at this interval
  max_read_failures: 10        # consecutive failed reads before reopening

# The running session (src/runtime/app.py).
session:
  # Hot-reloaded: edit and save this file while the co-pilot runs; a valid
  # edit is enforced within ~1 s, an invalid one is rejected with the
  # validator's line-numbered findings and the running protocol is kept.
  protocol: configs/protocols/bas_specimen_v1.json
  # null = the protocol's own object_profile (jar props). Swap to match
  # the props on the rig -- same protocol, lid steps skipped where the
  # props have no lid:
  #   configs/objects/profile_rect.yaml   red + yellow slabs (no lids)
  #   configs/objects/profile_mixed.yaml  red jar (screw cap) + yellow slab
  object_profile: null
  log_dir: logs                # logs/<session_id>.jsonl, hash-chained
  operator: null               # written into every log line when set

# Detections -> step events (src/perception/fusion.py). Debounce k-of-n
# comes from the protocol's timing (configs/defaults.yaml), per object.
# TUNE THESE ON harness/clip_fixtures "split: tune" CLIPS ONLY.
perception:
  enabled: true
  # A module counts as inside the container when this fraction of its
  # box lies inside the container's box (image space until ArUco).
  # Swept on the tuning clips: 0.6-0.8 equal (10/12), 0.9 worse (8/12).
  containment_min_overlap: 0.8
  # Votes older than this (no evidence for the object) are discarded.
  stale_s: 1.5
  # Containment geometry. image = today's image-box overlap (above).
  # auto = rack space (ArUco floor mm, configs/rack.yaml) whenever the
  # rack pose is known, image space otherwise. Rack space fixes rotated
  # containers and the open lid flap; it does NOT fix a module hovering
  # over the box (no height in a floor map). See src/perception/fusion.py.
  geometry: image
  rack_config: configs/rack.yaml
  # Re-detect the ArUco markers every Nth processed frame while the rack
  # pose is ok (every frame while lost or calibrating). The camera is fixed
  # and the pose holds hold_s (1 s) anyway; measured 19 ms of ~66 ms per
  # frame on a 1182x994 frame. 5 at ~15-20 det-fps = 3-4 checks per second.
  rack_every_n: 5
  # rack space: module centre may lie this far outside the footprint (mm)
  rack_margin_mm: 15
  # rack space: while open, the last CLOSED footprint is the interior if
  # the open box still covers this fraction of it (else it moved)
  closed_footprint_min_cover: 0.7
  # Operator presence for the attended_while_open rule (configs/defaults.yaml):
  # "hands gone" / "hands back" once k of the last n processed frames agree
  # (~1 s at 10 det-fps), so a detector missing a hand for a frame is not
  # "operator left". Hand classes = the object profile's
  # detector_classes_not_role_bound unless hand_classes is set here.
  hands_k: 8
  hands_n: 10
  hand_min_conf: 0.0
  # hand_classes: [hand_bare, hand_gloved]
  # Per-class minimum confidence on top of detector.conf, e.g. to damp a
  # class the model over-fires on:  {red_lid: 0.5}
  min_conf: {}
  # Minimum hold: a new state must keep its k-of-n votes this long (any
  # vote for the current state restarts the clock). Swept 2026-09-28 with
  # v5 (tune clips / live handheld stress recording, held-out only
  # reported): container 0-1.5 s no loss on tune (10/12), 2.0 s drops to
  # 6/12 -- so 1.0 keeps margin; module 1.0 no loss. Live flips 62 -> 30,
  # engine anomalies 22 -> 11. Covers sub-second flicker (the 0.8 s one
  # that ended a live session); does NOT cover a moved/handheld camera --
  # the camera must be fixed.
  container_min_hold_s: 1.0
  module_min_hold_s: 1.0
  # Ignore container/module detections outside the rig (hands are always
  # kept). OFF by default: built and unit-tested, NOT yet validated on
  # marker video (clips_Aruco is on Aryan's machine -- run
  # `scripts/replay_clip.py --geometry auto` there with margin_mm set).
  workspace:
    # rack space, when the ArUco pose is known: rig floor + this margin
    margin_mm: null            # e.g. 100
    # without markers: fixed image region, fractions of the frame
    roi: null                  # e.g. [0.15, 0.10, 0.85, 0.95]
  # Module lids (profiles with lid_class_id: jar, mixed). Detached = some
  # lid box lies off the body box -> open; the detached lid in view ->
  # stow (whole camera view = stow area, defaults.yaml); back on -> close.
  # Swept on train1-3 (2026-09-28): 6/6 lid steps for overlap 0.1-0.5,
  # k/n 2/4 or 3/5, hold 0-0.6 s; hold 1.0 s loses train2's 1.3 s detach.
  lid:
    attach_overlap: 0.3        # lid box fraction on the body below this = off it
    k: 3
    n: 5
    min_hold_s: 0.3
