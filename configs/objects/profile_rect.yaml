# configs/objects/profile_rect.yaml
#
# Binds abstract protocol roles to physical props for the "slab" prop
# family — rectangular, no lid. Same protocol JSON as profile_jar.yaml;
# has_lid: false makes every open/stow/close-lid step's `condition`
# evaluate false, so those steps are skipped silently (see addendum,
# "Conditional steps are skipped, not missed"). This is what makes the
# mixed-prop case testable: point one role at this profile's module and
# the other at profile_jar.yaml's module in a mixed_profile variant.

schema_version: 1
profile_id: rect
description: "Slab prop family: rectangular body, no lid."

roles:
  container:
    spoken_name: payload container
    # Same physical container as profile_jar.yaml's (mixed-profile
    # experiments point one role at each) -- kept consistent with it.
    # See configs/objects/LABELLING_GUIDANCE.md for why this is two
    # whole-shape classes, not a separately tracked lid bbox.
    state_class_ids:
      open: case_open
      closed: case_closed
    has_lid: true
    lid_type: hinged
    thresholds:
      grasp_distance_px: 40
      lid_open_angle_deg: 35

  # Detector classes are colour-based and cover both slab and cylinder
  # shapes (configs/objects/LABELLING_RULINGS.md), so a slab binds to the
  # same red_module / yellow_module classes as a jar. (This file said
  # `class_id: slab` -- a class the detector has never had.)
  module_a:
    spoken_name: red slab
    class_id: red_module
    has_lid: false

  module_b:
    spoken_name: yellow slab
    class_id: yellow_module
    has_lid: false

detector_classes_not_role_bound:
  - hand_gloved
  - hand_bare
