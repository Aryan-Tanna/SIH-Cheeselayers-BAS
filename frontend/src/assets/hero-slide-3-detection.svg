<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7a5ce0"/>
      <stop offset="60%" stop-color="#4a2bc2"/>
      <stop offset="100%" stop-color="#3a1f9c"/>
    </radialGradient>
    <linearGradient id="ring3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b6ef0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4a2bc2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a2bc2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4a2bc2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4a2bc2" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft3" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#4a2bc2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="300" cy="250" r="220" fill="url(#ring3)"/>
  <circle cx="300" cy="250" r="170" fill="url(#ring3)"/>

  <!-- floating: DOM tag badge -->
  <g transform="translate(110,110)">
    <circle cx="0" cy="0" r="30" fill="#FFFFFF" filter="url(#soft3)"/>
    <text x="0" y="6" font-size="14" font-weight="bold" text-anchor="middle" fill="#4a2bc2">&lt;/&gt;</text>
  </g>

  <!-- floating: regex badge -->
  <g transform="translate(490,120)">
    <circle cx="0" cy="0" r="30" fill="#FFFFFF" filter="url(#soft3)"/>
    <text x="0" y="6" font-size="16" font-weight="bold" text-anchor="middle" fill="#4a2bc2">.*</text>
  </g>

  <!-- Main: 3 stacked layer cards -->
  <g transform="translate(150,150)" filter="url(#soft3)">
    <rect x="0" y="100" width="300" height="60" rx="12" fill="#FFFFFF"/>
    <rect x="0" y="50" width="300" height="60" rx="12" fill="#FFFFFF"/>
    <rect x="0" y="0" width="300" height="60" rx="12" fill="url(#glow3)"/>

    <text x="24" y="34" font-size="13" font-weight="bold" fill="#FFFFFF">Layer 1 — DOM Signals</text>
    <text x="24" y="86" font-size="13" font-weight="bold" fill="#2b2b2b">Layer 2 — Regex + Checksum</text>
    <text x="24" y="136" font-size="13" font-weight="bold" fill="#2b2b2b">Layer 3 — Vision Model</text>

    <circle cx="272" cy="30" r="12" fill="#FFFFFF"/>
    <path d="M 267,30 L 271,34 L 278,25" fill="none" stroke="#4a2bc2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="272" cy="80" r="12" fill="none" stroke="#d8cdfa" stroke-width="3"/>
    <circle cx="272" cy="130" r="12" fill="none" stroke="#d8cdfa" stroke-width="3"/>

    <!-- scanning line across all layers -->
    <rect x="-10" y="-10" width="320" height="180" fill="url(#scan3)" opacity="0.5"/>
  </g>

  <!-- floating: eye/vision badge -->
  <g transform="translate(120,400)">
    <circle cx="0" cy="0" r="32" fill="#FFFFFF" filter="url(#soft3)"/>
    <path d="M -14,0 Q 0,-11 14,0 Q 0,11 -14,0 Z" fill="none" stroke="#4a2bc2" stroke-width="3"/>
    <circle cx="0" cy="0" r="4.5" fill="#4a2bc2"/>
  </g>

  <!-- floating: check badge -->
  <g transform="translate(480,400)">
    <circle cx="0" cy="0" r="30" fill="#FFFFFF" filter="url(#soft3)"/>
    <path d="M -10,1 L -3,9 L 11,-8" fill="none" stroke="#2E7D32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
