<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7a5ce0"/>
      <stop offset="60%" stop-color="#4a2bc2"/>
      <stop offset="100%" stop-color="#3a1f9c"/>
    </radialGradient>
    <linearGradient id="ring4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b6ef0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4a2bc2" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft4" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#4a2bc2" flood-opacity="0.22"/>
    </filter>
  </defs>

  <circle cx="300" cy="250" r="220" fill="url(#ring4)"/>
  <circle cx="300" cy="250" r="170" fill="url(#ring4)"/>

  <!-- connecting lines from center to 4 portal cards -->
  <g stroke="#c9b8f7" stroke-width="2.5" fill="none">
    <line x1="300" y1="250" x2="150" y2="120"/>
    <line x1="300" y1="250" x2="450" y2="120"/>
    <line x1="300" y1="250" x2="150" y2="380"/>
    <line x1="300" y1="250" x2="450" y2="380"/>
  </g>

  <!-- portal card: e-governance -->
  <g transform="translate(150,120)">
    <rect x="-52" y="-38" width="104" height="76" rx="10" fill="#FFFFFF" filter="url(#soft4)"/>
    <circle cx="0" cy="-12" r="14" fill="#f2efff" stroke="#4a2bc2" stroke-width="2"/>
    <path d="M -6,-12 L -2,-8 L 6,-17" fill="none" stroke="#4a2bc2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-30" y="10" width="60" height="6" rx="3" fill="#d8cdfa"/>
    <rect x="-20" y="20" width="40" height="6" rx="3" fill="#d8cdfa"/>
  </g>

  <!-- portal card: banking -->
  <g transform="translate(450,120)">
    <rect x="-52" y="-38" width="104" height="76" rx="10" fill="#FFFFFF" filter="url(#soft4)"/>
    <rect x="-16" y="-22" width="32" height="20" rx="3" fill="none" stroke="#4a2bc2" stroke-width="2.4"/>
    <line x1="-16" y1="-14" x2="16" y2="-14" stroke="#4a2bc2" stroke-width="2.4"/>
    <rect x="-30" y="10" width="60" height="6" rx="3" fill="#d8cdfa"/>
    <rect x="-20" y="20" width="40" height="6" rx="3" fill="#d8cdfa"/>
  </g>

  <!-- portal card: identity -->
  <g transform="translate(150,380)">
    <rect x="-52" y="-38" width="104" height="76" rx="10" fill="#FFFFFF" filter="url(#soft4)"/>
    <circle cx="-8" cy="-16" r="7" fill="none" stroke="#4a2bc2" stroke-width="2.4"/>
    <path d="M -18,-2 Q -8,-10 2,-2" fill="none" stroke="#4a2bc2" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="4" y="-20" width="22" height="16" rx="2" fill="none" stroke="#4a2bc2" stroke-width="2"/>
    <rect x="-30" y="14" width="60" height="6" rx="3" fill="#d8cdfa"/>
  </g>

  <!-- portal card: healthcare -->
  <g transform="translate(450,380)">
    <rect x="-52" y="-38" width="104" height="76" rx="10" fill="#FFFFFF" filter="url(#soft4)"/>
    <path d="M 0,-24 L 0,-2 M -11,-13 L 11,-13" stroke="#4a2bc2" stroke-width="4.5" stroke-linecap="round"/>
    <rect x="-30" y="10" width="60" height="6" rx="3" fill="#d8cdfa"/>
    <rect x="-20" y="20" width="40" height="6" rx="3" fill="#d8cdfa"/>
  </g>

  <!-- center: extension icon -->
  <g transform="translate(300,250)" filter="url(#soft4)">
    <circle cx="0" cy="0" r="62" fill="url(#glow4)"/>
    <g transform="translate(-22,-22) scale(1.1)">
      <path d="M 8,0 L 20,0 L 20,8 A 6,6 0 0 1 20,20 L 20,28 L 28,28 A 6,6 0 0 1 40,28 L 40,40 L 0,40 L 0,8 Z"
            fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
