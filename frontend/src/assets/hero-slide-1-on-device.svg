<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7a5ce0"/>
      <stop offset="60%" stop-color="#4a2bc2"/>
      <stop offset="100%" stop-color="#3a1f9c"/>
    </radialGradient>
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b6ef0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4a2bc2" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft1" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#4a2bc2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- glow rings -->
  <circle cx="330" cy="250" r="220" fill="url(#ring1)"/>
  <circle cx="330" cy="250" r="170" fill="url(#ring1)"/>

  <!-- floating badge: lock (top left) -->
  <g transform="translate(120,90)">
    <circle cx="0" cy="0" r="34" fill="#FFFFFF" filter="url(#soft1)"/>
    <rect x="-11" y="-3" width="22" height="17" rx="3" fill="none" stroke="#4a2bc2" stroke-width="3.5"/>
    <path d="M -7,-3 L -7,-9 A 7,7 0 0 1 7,-9 L 7,-3" fill="none" stroke="#4a2bc2" stroke-width="3.5"/>
  </g>

  <!-- floating badge: cloud upload (top right) -->
  <g transform="translate(470,110)">
    <circle cx="0" cy="0" r="30" fill="#FFFFFF" filter="url(#soft1)"/>
    <path d="M -11,4 A 8,8 0 0 1 -9,-11 A 10,10 0 0 1 10,-8 A 7,7 0 0 1 9,4 Z" fill="none" stroke="#4a2bc2" stroke-width="3"/>
    <path d="M 0,-2 L 0,10 M -5,3 L 0,-2 L 5,3" fill="none" stroke="#4a2bc2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main device: browser window -->
  <g transform="translate(150,150)" filter="url(#soft1)">
    <rect x="0" y="0" width="330" height="230" rx="16" fill="#FFFFFF"/>
    <!-- browser chrome bar -->
    <rect x="0" y="0" width="330" height="34" rx="16" fill="url(#glow1)"/>
    <rect x="0" y="18" width="330" height="16" fill="url(#glow1)"/>
    <circle cx="20" cy="17" r="5" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="38" cy="17" r="5" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="56" cy="17" r="5" fill="#FFFFFF" opacity="0.4"/>
    <rect x="90" y="10" width="200" height="14" rx="7" fill="#FFFFFF" opacity="0.25"/>

    <!-- form content -->
    <text x="24" y="66" font-size="13" font-weight="bold" fill="#2b2b2b">Application Form</text>

    <text x="24" y="94" font-size="10" fill="#6b6b6b">Full Name</text>
    <rect x="24" y="100" width="282" height="22" rx="5" fill="#f2efff" stroke="#d8cdfa"/>
    <rect x="34" y="107" width="90" height="8" rx="2" fill="#8a8a8a"/>

    <text x="24" y="140" font-size="10" fill="#6b6b6b">Aadhaar Number</text>
    <rect x="24" y="146" width="282" height="22" rx="5" fill="#1b1b1b"/>
    <rect x="34" y="152" width="60" height="10" rx="2" fill="#FFFFFF"/>
    <rect x="102" y="152" width="60" height="10" rx="2" fill="#FFFFFF"/>
    <rect x="170" y="152" width="60" height="10" rx="2" fill="#FFFFFF"/>
    <!-- small lock on redacted field -->
    <g transform="translate(292,157)">
      <rect x="-6" y="-2" width="12" height="9" rx="2" fill="#4a2bc2"/>
      <path d="M -4,-2 L -4,-5 A 4,4 0 0 1 4,-5 L 4,-2" fill="none" stroke="#4a2bc2" stroke-width="2"/>
    </g>

    <text x="24" y="186" font-size="10" fill="#6b6b6b">Email</text>
    <rect x="24" y="192" width="282" height="22" rx="5" fill="#f2efff" stroke="#d8cdfa"/>
    <rect x="34" y="199" width="130" height="8" rx="2" fill="#8a8a8a"/>
  </g>

  <!-- floating badge: shield check (bottom right) -->
  <g transform="translate(480,380)">
    <circle cx="0" cy="0" r="34" fill="#FFFFFF" filter="url(#soft1)"/>
    <path d="M 0,-13 L 11,-8 L 11,3 Q 11,14 0,19 Q -11,14 -11,3 L -11,-8 Z" fill="none" stroke="#2E7D32" stroke-width="3"/>
    <path d="M -5,1 L -1,6 L 6,-5" fill="none" stroke="#2E7D32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
