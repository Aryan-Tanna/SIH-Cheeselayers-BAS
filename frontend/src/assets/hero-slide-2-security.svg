<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7a5ce0"/>
      <stop offset="60%" stop-color="#4a2bc2"/>
      <stop offset="100%" stop-color="#3a1f9c"/>
    </radialGradient>
    <linearGradient id="ring2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b6ef0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4a2bc2" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#4a2bc2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="300" cy="250" r="220" fill="url(#ring2)"/>
  <circle cx="300" cy="250" r="170" fill="url(#ring2)"/>

  <!-- floating: server/offline badge (top left) -->
  <g transform="translate(110,110)">
    <circle cx="0" cy="0" r="32" fill="#FFFFFF" filter="url(#soft2)"/>
    <rect x="-12" y="-10" width="24" height="9" rx="2" fill="none" stroke="#4a2bc2" stroke-width="3"/>
    <rect x="-12" y="1" width="24" height="9" rx="2" fill="none" stroke="#4a2bc2" stroke-width="3"/>
    <circle cx="6" cy="-5.5" r="1.6" fill="#4a2bc2"/>
    <circle cx="6" cy="5.5" r="1.6" fill="#4a2bc2"/>
  </g>

  <!-- floating: flag/emblem badge (top right) -->
  <g transform="translate(490,120)">
    <circle cx="0" cy="0" r="30" fill="#FFFFFF" filter="url(#soft2)"/>
    <circle cx="0" cy="0" r="13" fill="none" stroke="#4a2bc2" stroke-width="3"/>
    <circle cx="0" cy="0" r="2.4" fill="#4a2bc2"/>
    <line x1="0" y1="-13" x2="0" y2="-16" stroke="#4a2bc2" stroke-width="3"/>
    <line x1="0" y1="13" x2="0" y2="16" stroke="#4a2bc2" stroke-width="3"/>
    <line x1="-13" y1="0" x2="-16" y2="0" stroke="#4a2bc2" stroke-width="3"/>
    <line x1="13" y1="0" x2="16" y2="0" stroke="#4a2bc2" stroke-width="3"/>
  </g>

  <!-- Main: big shield -->
  <g transform="translate(300,270)" filter="url(#soft2)">
    <path d="M 0,-150 L 95,-115 L 95,10 Q 95,120 0,165 Q -95,120 -95,10 L -95,-115 Z" fill="url(#glow2)"/>
    <path d="M 0,-150 L 95,-115 L 95,10 Q 95,120 0,165 Q -95,120 -95,10 L -95,-115 Z" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.35"/>
    <!-- inner lock -->
    <g transform="translate(0,-10)">
      <rect x="-32" y="-6" width="64" height="52" rx="8" fill="#FFFFFF"/>
      <path d="M -20,-6 L -20,-28 A 20,20 0 0 1 20,-28 L 20,-6" fill="none" stroke="#FFFFFF" stroke-width="9"/>
      <circle cx="0" cy="18" r="7" fill="#4a2bc2"/>
      <rect x="-3" y="18" width="6" height="14" rx="3" fill="#4a2bc2"/>
    </g>
  </g>

  <!-- floating: check badge (bottom left) -->
  <g transform="translate(130,410)">
    <circle cx="0" cy="0" r="32" fill="#FFFFFF" filter="url(#soft2)"/>
    <path d="M -11,1 L -3,10 L 12,-9" fill="none" stroke="#2E7D32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- floating: globe/offline badge (bottom right) -->
  <g transform="translate(480,400)">
    <circle cx="0" cy="0" r="30" fill="#FFFFFF" filter="url(#soft2)"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#4a2bc2" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="6" ry="14" fill="none" stroke="#4a2bc2" stroke-width="2.2"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#4a2bc2" stroke-width="2.2"/>
  </g>
</svg>
