[project]
name = "bas-har-copilot"
version = "0.1.0"
description = "BAS Glovebox HAR Co-Pilot — SIH PS 26174"
requires-python = ">=3.11"
dependencies = [
    "pyyaml==6.0.2",
    "jsonschema==4.23.0",
]

[project.optional-dependencies]
# Perception/audio/GUI extras. Deliberately NOT installed in phase 0 and
# NEVER imported at module level anywhere under src/ or harness/ — the
# replay harness must run with --stub-detector before any model exists,
# and importing these at module scope would break that on a clean install.
vision = [
    # opencv-python and opencv-contrib-python both provide a top-level
    # `cv2` package and conflict if both are installed -- contrib is a
    # strict superset, and mediapipe pulls it in anyway (below), so it
    # is the only one listed here. Do not add opencv-python alongside
    # it; installing both corrupts the shared cv2 install (confirmed:
    # cv2.imread disappears entirely).
    "opencv-contrib-python==5.0.0.93",
    "ultralytics==8.3.28",
    # ultralytics' own dependency list pulls in opencv-python transitively
    # -- pip has no way to see that it conflicts with opencv-contrib-python
    # above (different PyPI names, same `cv2` import), so a plain
    # `pip install -e ".[vision]"` WILL reintroduce the corruption
    # described above. After installing this extra, always run:
    #   pip uninstall -y opencv-python
    #   pip install --force-reinstall --no-deps opencv-contrib-python==5.0.0.93
    # and verify with `python -c "import cv2; cv2.imread(...); cv2.aruco"`
    # before trusting the environment -- cv2.aruco (contrib-only) is the
    # more likely casualty of the two, not cv2.imread.
    # 0.10.18 (original pin) has no Python 3.13 wheel. 0.10.30, the
    # oldest version that does, removed the classic mediapipe.solutions
    # API entirely (only the newer mediapipe.tasks API remains, which
    # needs an explicit local model file -- see models/README.md) AND
    # has a broken native-library loader on Windows for this project's
    # actual use (HandLandmarker.create_from_options() raises
    # `AttributeError: function 'free' not found` inside
    # mediapipe_c_bindings.load_shared_library -- a packaging bug, not
    # anything in this repo's code). 1.0.1 is confirmed working:
    # scripts/test_mediapipe_gloves.py runs end-to-end against it.
    "mediapipe==1.0.1",
    "pillow==11.0.0",
    # Recording + stream (src/runtime/recorder.py): a pinned ffmpeg binary
    # with libx264 for Windows/macOS/Linux, so the demo machine needs no
    # system ffmpeg. Offline once installed.
    "imageio-ffmpeg==0.6.0",
]
# Voice + earcons (src/runtime/audio*.py, tts.py, earcons.py). Same rule
# as `vision`: never imported at module level under src/. piper-tts ships
# abi3 wheels (Windows/macOS/Linux, Python >=3.9) and needs only
# onnxruntime; its voice model is vendored under models/tts/ (see
# models/README.md), never fetched at runtime. sounddevice bundles
# PortAudio on Windows/macOS; Linux needs the system libportaudio2.
# vosk: offline "Hey BAS" voice commands (src/runtime/voice_control.py),
# model vendored under models/asr/. Its own imports of requests/
# websockets are for optional model download/server use, never called
# here -- the model is loaded from a local path, no network at runtime.
audio = [
    "piper-tts==1.8.0",
    "sounddevice==0.5.3",
    "vosk==0.3.45",
    "numpy>=2",
]
dev = [
    "pytest==8.3.3",
    "pytest-cov==6.0.0",
    # Exporting a trained .pt to ONNX (models/README.md). Dev-time only:
    # the runtime loads the .onnx with onnxruntime, already pinned above.
    "onnx==1.23.0",
    "onnxscript==0.7.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "harness*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
